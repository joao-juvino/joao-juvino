  <circle cx="1110" cy="-10" r="175" fill="#38BDF8" opacity=".06"/>
  <circle cx="920" cy="285" r="180" fill="#38BDF8" opacity=".04"/>
  <rect x="55" y="54" width="5" height="161" rx="2.5" fill="url(#line)"/>
  <text x="87" y="90" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">OLÁ, EU SOU</text>
  <text x="85" y="153" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="700">João Santos<tspan fill="#38BDF8">.</tspan></text>
  <text x="88" y="203" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="26">Engenheiro de Software Fullstack</text>
  <rect x="789" y="40" width="354" height="188" rx="16" fill="#0B1220" fill-opacity=".84" stroke="#29608B"/>
  <circle cx="817" cy="64" r="5" fill="#38BDF8"/>
  <circle cx="835" cy="64" r="5" fill="#27658C"/>
  <circle cx="853" cy="64" r="5" fill="#27658C"/>

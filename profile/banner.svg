<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title description">
  <title id="title">João Santos — Engenheiro de Software Fullstack</title>
  <desc id="description">Banner em azul marinho com detalhes em azul e ciano, apresentando Java, Spring Boot, Next.js, React, .NET e AWS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#10233F"/>
      <stop offset="100%" stop-color="#0B3B61"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#93C5FD" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="268" rx="20" fill="url(#bg)" stroke="#28547A" stroke-width="2"/>

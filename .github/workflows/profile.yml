name: Atualizar visual do perfil

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-imagens:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gerar cartão de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&locale=pt-br&bg_color=0D1117&title_color=38BDF8&text_color=E2E8F0&icon_color=38BDF8&border_color=1E3A5F&hide_border=false'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gerar cartão de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=460&size_weight=0.5&count_weight=0.5&bg_color=0D1117&title_color=38BDF8&text_color=E2E8F0&border_color=1E3A5F&hide_border=false'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gerar cobrinha das contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?color_snake=%2338BDF8&color_dots=%230D1117,%2313344C,%23195D83,%230EA5E9,%2367E8F9
            profile/snake-light.svg?color_snake=%230368A8&color_dots=%23F6F8FA,%23CDEBFA,%239EDDF5,%2349AFE0,%230368A8

      - name: Publicar imagens no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza imagens do perfil"
            git push
          fi
